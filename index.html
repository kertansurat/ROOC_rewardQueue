<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guild Queue Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>

    <!-- Firebase SDK (v10 Cloud Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv_QQ_O8SE88WFTwro2hJJYGDRA4Jdds8",
            authDomain: "bellona-gvg.firebaseapp.com",
            projectId: "bellona-gvg",
            storageBucket: "bellona-gvg.firebasestorage.app",
            messagingSenderId: "871679564546",
            appId: "1:871679564546:web:c4b43efd62a2d57f8c001b",
            measurementId: "G-Q2BHJJJKRP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.doc = doc;
        window.updateDoc = updateDoc;
    </script>
</head>
<body class="min-h-screen pb-16">

    <!-- Header Section -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg backdrop-blur-md bg-opacity-90">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-blue-500/30">
                    Q
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-bold text-white leading-tight">Guild Queue</h1>
                    <p class="text-[11px] sm:text-xs text-slate-400">ระบบแสดงลำดับคิวรับของรางวัล (bellona-gvg)</p>
                </div>
            </div>

            <button id="admin-toggle-btn" onclick="handleAdminToggle()" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 text-slate-200 shadow-md">
                <span id="admin-icon">🔒</span> <span id="admin-text">โหมดผู้ดู (Read-only)</span>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-6 mt-4 space-y-4">

        <!-- Control Panel สำหรับปรับโควต้า -->
        <div id="admin-panel-container" class="hidden bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <h2 class="text-xs sm:text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <span>⚙️</span> ตั้งค่าจำนวนโควต้าของรางวัล
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1">
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <label class="block text-xs font-semibold text-slate-200 mb-1">🕊️ ขนขาว</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-white-max" value="50" onchange="updateConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center font-bold">
                        <span class="text-[10px] text-slate-400">หน้า</span>
                    </div>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-red-950/40">
                    <label class="block text-xs font-semibold text-red-400 mb-1">🪶 ขนแดง</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-red-max" value="80" onchange="updateConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-red-400 text-center font-bold">
                        <span class="text-[10px] text-slate-400">หน้า</span>
                    </div>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-blue-950/40">
                    <label class="block text-xs font-semibold text-blue-400 mb-1">📘 สมุดการ์ด</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-card-max" value="1" onchange="updateConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-blue-400 text-center font-bold">
                        <span class="text-[10px] text-slate-400">เล่ม</span>
                    </div>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-amber-950/40">
                    <label class="block text-xs font-semibold text-amber-400 mb-1">📦 เศษทอง</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-chest-max" value="1" onchange="updateConfig()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-amber-400 text-center font-bold">
                        <span class="text-[10px] text-slate-400">ชิ้น</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 grid grid-cols-2 sm:grid-cols-4 gap-1.5 shadow-lg">
            <button onclick="switchTab('white')" id="tab-btn-white" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">🕊️ ขนขาว</button>
            <button onclick="switchTab('red')" id="tab-btn-red" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">🪶 ขนแดง</button>
            <button onclick="switchTab('card')" id="tab-btn-card" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">📘 สมุดการ์ด</button>
            <button onclick="switchTab('chest')" id="tab-btn-chest" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">📦 เศษทอง</button>
        </div>

        <!-- Content Area -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 sm:p-5 shadow-xl min-h-[450px]">
            <div class="flex flex-wrap justify-between items-center pb-3 mb-3 border-b border-slate-800 gap-2">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2" id="current-tab-title">🕊️ คิวขนขาว</h2>
                    <p class="text-[11px] sm:text-xs text-slate-400" id="current-tab-sub">แสดงรายชื่อคิว</p>
                </div>
                <div class="flex items-center gap-2">
                    <!-- ปุ่มรีเซ็ตคิวเฉพาะหมวดนี้ (แสดงเฉพาะโหมด Admin) -->
                    <button id="admin-reset-tab-btn" onclick="resetCurrentCategory()" class="hidden bg-red-950 hover:bg-red-900 text-red-300 border border-red-800/60 text-xs font-semibold px-3 py-1.5 rounded-xl transition items-center gap-1 shadow">
                        <span>🔄</span> รีเซ็ตคิวหมวดนี้
                    </button>
                    <button onclick="copyCurrentQueueList()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl transition flex items-center gap-1.5 shadow-md active:scale-95">
                        <span>📋</span> คัดลอกรายชื่อถึงคิว
                    </button>
                </div>
            </div>

            <!-- รายชื่อคิว -->
            <div id="active-queue-list" class="space-y-2.5">
                <div class="text-center text-slate-500 py-10">กำลังโหลดรายชื่อจาก Firestore...</div>
            </div>
        </div>

    </main>

    <!-- Modal ใส่รหัส Admin -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto text-xl mb-2">🔐</div>
                <h3 class="font-bold text-slate-100 text-base">เข้าสู่โหมดแอดมิน (Admin)</h3>
            </div>
            <form onsubmit="verifyAdminPassword(event)" class="space-y-3">
                <input type="password" id="admin-pass-input" required placeholder="ใส่รหัสผ่านแอดมิน..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white text-center focus:outline-none focus:border-blue-500">
                <div id="admin-error-msg" class="text-xs text-red-400 text-center hidden"></div>
                <div class="flex gap-2 pt-1">
                    <button type="button" onclick="closeAdminModal()" class="w-1/2 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
                    <button type="submit" id="admin-submit-btn" class="w-1/2 py-2 bg-blue-600 text-white font-bold rounded-xl text-xs">ยืนยัน</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isAdmin = false;
        let activeTab = 'white';

        let config = { whiteMax: 50, redMax: 80, cardQuota: 1, chestQuota: 1 };
        let memberList = [];
        let editingIndex = -1;

        window.addEventListener('DOMContentLoaded', () => {
            const checkFirestore = setInterval(() => {
                if (window.db) {
                    clearInterval(checkFirestore);
                    listenToPlayersCollection();
                }
            }, 100);
        });

        function listenToPlayersCollection() {
            try {
                const playersRef = window.collection(window.db, 'players');
                
                window.onSnapshot(playersRef, (snapshot) => {
                    let tempArr = [];
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const pName = data.name || data.discordDisplayName || data.discordUsername || docSnap.id;
                        const pJob = data.job ? ` (${data.job})` : '';

                        // รองรับสถานะการรับรางวัลแยกตามหมวดหมู่ (ถ้าไม่มีให้เป็น false)
                        const receivedMap = data.receivedMap || {};

                        tempArr.push({ 
                            id: docSnap.id, 
                            name: `${pName}${pJob}`,
                            order: typeof data.order === 'number' ? data.order : 999,
                            receivedMap: receivedMap 
                        });
                    });

                    // เรียงลำดับตาม order
                    tempArr.sort((a, b) => a.order - b.order);
                    memberList = tempArr;

                    renderAll();
                }, (error) => {
                    console.error("Firestore Read Error:", error);
                });
            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        // บันทึกสถานะรับรางวัลเฉพาะคนลง Firestore
        async function updatePlayerReceivedFirestore(index) {
            try {
                const item = memberList[index];
                const docRef = window.doc(window.db, "players", item.id);
                await window.updateDoc(docRef, { 
                    receivedMap: item.receivedMap 
                });
            } catch (e) {
                console.error("เกิดข้อผิดพลาดในการบันทึกสถานะ:", e);
            }
        }

        // บันทึกลำดับทั้งหมดลง Firestore
        async function saveAllOrderToFirestore() {
            try {
                for (let i = 0; i < memberList.length; i++) {
                    memberList[i].order = i;
                    const docRef = window.doc(window.db, "players", memberList[i].id);
                    await window.updateDoc(docRef, { order: i });
                }
            } catch (e) {
                console.error("เกิดข้อผิดพลาดในการบันทึกลำดับคิว:", e);
            }
        }

        function handleAdminToggle() {
            if (isAdmin) {
                isAdmin = false;
                editingIndex = -1;
                updateAdminUI();
            } else {
                document.getElementById('admin-pass-input').value = '';
                document.getElementById('admin-error-msg').classList.add('hidden');
                document.getElementById('admin-modal').classList.remove('hidden');
            }
        }

        async function verifyAdminPassword(e) {
            e.preventDefault();
            const passInput = document.getElementById('admin-pass-input').value;
            const errorMsg = document.getElementById('admin-error-msg');
            const submitBtn = document.getElementById('admin-submit-btn');

            errorMsg.classList.add('hidden');
            submitBtn.innerText = 'กำลังตรวจสอบ...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/verify-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passInput })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    isAdmin = true;
                    closeAdminModal();
                    updateAdminUI();
                } else {
                    errorMsg.innerText = data.message || 'รหัสผ่านไม่ถูกต้อง!';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.innerText = 'ยืนยัน';
                submitBtn.disabled = false;
            }
        }

        function closeAdminModal() { 
            document.getElementById('admin-modal').classList.add('hidden'); 
        }

        function updateAdminUI() {
            document.getElementById('admin-text').innerText = isAdmin ? 'โหมดปรับแต่ง (Admin)' : 'โหมดผู้ดู (Read-only)';
            document.getElementById('admin-icon').innerText = isAdmin ? '🔓' : '🔒';
            document.getElementById('admin-panel-container').className = isAdmin ? 'bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3' : 'hidden';
            
            const resetBtn = document.getElementById('admin-reset-tab-btn');
            if (isAdmin) {
                resetBtn.classList.remove('hidden');
                resetBtn.classList.add('flex');
            } else {
                resetBtn.classList.add('hidden');
                resetBtn.classList.remove('flex');
            }

            renderAll();
        }

        function switchTab(type) {
            activeTab = type;
            editingIndex = -1;
            renderAll();
        }

        function updateConfig() {
            config.whiteMax = parseInt(document.getElementById('cfg-white-max').value) || 50;
            config.redMax = parseInt(document.getElementById('cfg-red-max').value) || 80;
            config.cardQuota = parseInt(document.getElementById('cfg-card-max').value) || 1;
            config.chestQuota = parseInt(document.getElementById('cfg-chest-max').value) || 1;
            renderAll();
        }

        // 🔄 รีเซ็ตสถานะรับรางวัลเฉพาะหมวดหมู่ปัจจุบัน (เมื่อทุกคนได้รางวัลครบในรอบนั้นแล้ว)
        async function resetCurrentCategory() {
            const titles = { white: 'ขนขาว', red: 'ขนแดง', card: 'สมุดการ์ด', chest: 'เศษกล่องทอง' };
            if (confirm(`⚠️ คุณต้องการรีเซ็ตสถานะการรับรางวัลของหมวด "${titles[activeTab]}" ให้ทุกคนกลับเป็นยังไม่ได้ทั้งหมดหรือไม่?`)) {
                for (let i = 0; i < memberList.length; i++) {
                    if (!memberList[i].receivedMap) memberList[i].receivedMap = {};
                    memberList[i].receivedMap[activeTab] = false;
                    const docRef = window.doc(window.db, "players", memberList[i].id);
                    await window.updateDoc(docRef, { receivedMap: memberList[i].receivedMap });
                }
                renderAll();
                alert(`รีเซ็ตสถานะหมวด ${titles[activeTab]} สำเร็จ!`);
            }
        }

        // 🔄 ฟังก์ชันสลับสถานะรับรางวัล / ยกเลิก (กรณีแอดมินกดผิด)
        async function toggleReceivedStatus(index) {
            const item = memberList[index];
            if (!item.receivedMap) item.receivedMap = {};
            item.receivedMap[activeTab] = !item.receivedMap[activeTab];

            renderAll();
            await updatePlayerReceivedFirestore(index);
        }

        // ✅ ฟังก์ชันรันคิว: ย้ายคนนี้ไปต่อท้ายสุด และทำเครื่องหมายว่าได้รับแล้วในหมวดนี้
        async function completeQueue(index) {
            const memberName = memberList[index].name;
            if (confirm(`ยืนยันการให้รางวัลแก่ "${memberName}" ?\n(รายชื่อนี้จะถูกบันทึกว่าได้รับแล้วและย้ายไปต่อท้ายสุดของคิว)`)) {
                if (!memberList[index].receivedMap) memberList[index].receivedMap = {};
                memberList[index].receivedMap[activeTab] = true;

                // ย้ายไปต่อท้ายสุด
                const completedItem = memberList.splice(index, 1)[0];
                memberList.push(completedItem);
                
                renderAll();
                await saveAllOrderToFirestore();
                // บันทึกสถานะ receivedMap ของตัวที่ถูกย้ายไปท้ายด้วย
                await updatePlayerReceivedFirestore(memberList.length - 1);
            }
        }

        // กดปุ่มขึ้น-ลง เพื่อสลับคิว
        async function moveQueue(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < memberList.length) {
                const temp = memberList[index];
                memberList[index] = memberList[newIndex];
                memberList[newIndex] = temp;

                renderAll();
                await saveAllOrderToFirestore();
            }
        }

        function startEditing(index) {
            editingIndex = index;
            renderAll();
        }

        // กดยอมรับการเปลี่ยนชื่อจาก Dropdown
        async function saveEditing(index) {
            const selectEl = document.getElementById(`dropdown-select-${index}`);
            if (selectEl) {
                const selectedTargetIndex = parseInt(selectEl.value);
                if (selectedTargetIndex !== index) {
                    const temp = memberList[index];
                    memberList[index] = memberList[selectedTargetIndex];
                    memberList[selectedTargetIndex] = temp;

                    renderAll();
                    await saveAllOrderToFirestore();
                }
            }
            editingIndex = -1;
            renderAll();
        }

        function copyCurrentQueueList() {
            const type = activeTab;
            const titles = { white: '🕊️ ขนขาว', red: '🪶 ขนแดง', card: '📘 สมุดการ์ด', chest: '📦 เศษกล่องทอง' };
            const quotaMap = { white: config.whiteMax, red: config.redMax, card: config.cardQuota, chest: config.chestQuota };

            const activeList = memberList.slice(0, quotaMap[type]);
            if (activeList.length === 0) { alert('ไม่มีรายชื่อในคิวนี้'); return; }

            let text = `📢 **รายชื่อถึงคิวรับ ${titles[type]}** (${activeList.length} ท่าน)\n------------------------------\n`;
            activeList.forEach((item, index) => {
                if (type === 'white') text += `${index + 1}. ${item.name} (หน้า ${index + 1})\n`;
                else if (type === 'red') text += `${index + 1}. ${item.name} (หน้า ${config.whiteMax + index + 1})\n`;
                else text += `${index + 1}. ${item.name}\n`;
            });

            navigator.clipboard.writeText(text).then(() => { alert(`คัดลอกรายชื่อเรียบร้อยแล้ว!`); });
        }

        function renderAll() {
            ['white', 'red', 'card', 'chest'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === activeTab) {
                    btn.className = 'px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition bg-blue-600 text-white shadow-md shadow-blue-600/30';
                } else {
                    btn.className = 'px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition bg-slate-950 text-slate-400 hover:text-white';
                }
            });

            const titles = { white: '🕊️ คิวขนขาว', red: '🪶 คิวขนแดง', card: '📘 คิวสมุดการ์ด', chest: '📦 คิวเศษกล่องทอง' };
            const subTitles = {
                white: `โควต้า: ${config.whiteMax} หน้า (หน้า 1 – ${config.whiteMax})`,
                red: `โควต้า: ${config.redMax} หน้า (หน้า ${config.whiteMax + 1} – ${config.whiteMax + config.redMax})`,
                card: `โควต้า: ${config.cardQuota} เล่ม`,
                chest: `โควต้า: ${config.chestQuota} ชิ้น`
            };

            document.getElementById('current-tab-title').innerText = titles[activeTab];
            document.getElementById('current-tab-sub').innerText = subTitles[activeTab];

            renderActiveList();
        }

        function renderActiveList() {
            const container = document.getElementById('active-queue-list');
            container.innerHTML = '';
            const type = activeTab;
            const quotaMap = { white: config.whiteMax, red: config.redMax, card: config.cardQuota, chest: config.chestQuota };
            const quotaMax = quotaMap[type];

            if (memberList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-600 py-12 text-sm">ไม่พบรายชื่อผู้เล่นในระบบ</div>`;
                return;
            }

            memberList.forEach((item, index) => {
                const card = document.createElement('div');
                const isCurrentQueue = index < quotaMax;
                const pageNum = index + 1;
                const isEditingThis = (editingIndex === index);
                const hasReceived = item.receivedMap && item.receivedMap[type] === true;

                let pageBadgeHTML = '';
                if (type === 'white') {
                    pageBadgeHTML = `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-200 text-slate-900 shrink-0">หน้า ${pageNum}</span>`;
                } else if (type === 'red') {
                    pageBadgeHTML = `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-red-950 text-red-300 border border-red-800/60 shrink-0">หน้า ${config.whiteMax + pageNum}</span>`;
                } else {
                    pageBadgeHTML = `<span class="w-7 h-7 flex items-center justify-center text-xs font-bold rounded-full bg-slate-800 text-slate-300 border border-slate-700 shrink-0">${pageNum}</span>`;
                }

                card.className = `p-3 sm:p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 transition ${
                    hasReceived 
                        ? 'bg-slate-900/40 border-slate-800/50 opacity-60' 
                        : (isCurrentQueue ? 'bg-emerald-950/25 border-emerald-500/40 shadow-sm' : 'bg-slate-950/80 border-slate-800')
                }`;

                let nameAreaHTML = '';
                if (isEditingThis && isAdmin) {
                    let optionsHTML = '';
                    memberList.forEach((m, idx) => {
                        optionsHTML += `<option value="${idx}" ${idx === index ? 'selected' : ''}>${m.name}</option>`;
                    });
                    nameAreaHTML = `
                        <select id="dropdown-select-${index}" class="bg-slate-900 border border-blue-500 text-white text-sm rounded-lg px-2.5 py-1.5 focus:outline-none max-w-xs sm:max-w-md">
                            ${optionsHTML}
                        </select>
                    `;
                } else {
                    let statusBadge = '';
                    if (hasReceived) {
                        statusBadge = `<span class="text-[10px] font-normal bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">ได้รับรางวัลแล้ว (รอบนี้)</span>`;
                    } else if (isCurrentQueue) {
                        statusBadge = `<span class="text-[10px] font-normal bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/40">ถึงคิวแล้ว</span>`;
                    }

                    nameAreaHTML = `
                        <div class="text-sm sm:text-base font-semibold text-slate-100 break-all flex items-center gap-2 flex-wrap">
                            <span class="${hasReceived ? 'line-through text-slate-400' : ''}">${item.name}</span>
                            ${statusBadge}
                        </div>
                    `;
                }

                let adminActionButtons = '';
                if (isAdmin) {
                    if (isEditingThis) {
                        adminActionButtons = `
                            <button onclick="saveEditing(${index})" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow">
                                ✓ ยอมรับ
                            </button>
                        `;
                    } else {
                        // ปุ่มรับรางวัล / หรือสลับสถานะกลับเป็นยังไม่ได้
                        let mainBtnText = hasReceived ? '↩️ ยกเลิกสถานะ' : '✅ รับรางวัล';
                        let mainBtnAction = hasReceived ? `toggleReceivedStatus(${index})` : `completeQueue(${index})`;
                        let mainBtnClass = hasReceived 
                            ? 'bg-amber-800/80 hover:bg-amber-700 text-amber-200 border-amber-700' 
                            : 'bg-emerald-700 hover:bg-emerald-600 text-white border-emerald-600';

                        adminActionButtons = `
                            <button onclick="${mainBtnAction}" class="px-2.5 py-1 ${mainBtnClass} rounded-lg text-xs font-bold transition border flex items-center gap-1 shadow">
                                ${mainBtnText}
                            </button>
                            <button onclick="startEditing(${index})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg text-xs transition border border-slate-700">
                                ✏️ แก้ไข
                            </button>
                            <button onclick="moveQueue(${index}, -1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded-lg text-sm text-slate-300 transition border border-slate-800">↑</button>
                            <button onclick="moveQueue(${index}, 1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded-lg text-sm text-slate-300 transition border border-slate-800">↓</button>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0 flex-1">
                        ${pageBadgeHTML}
                        <div class="min-w-0 flex-1">
                            ${nameAreaHTML}
                        </div>
                    </div>

                    ${isAdmin ? `
                        <div class="flex items-center gap-1.5 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-800/80 justify-end shrink-0">
                            ${adminActionButtons}
                        </div>
                    ` : ''}
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
