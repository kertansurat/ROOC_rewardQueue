<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rooc Reward - Guild Queue Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>

    <!-- Firebase SDK (v10 Cloud Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv_QQ_O8SE88WFTwro2hJJYGDRA4Jdds8",
            authDomain: "bellona-gvg.firebaseapp.com",
            projectId: "bellona-gvg",
            storageBucket: "bellona-gvg.firebasestorage.app",
            messagingSenderId: "871679564546",
            appId: "1:871679564546:web:c4b43efd62a2d57f8c001b",
            measurementId: "G-Q2BHJJJKRP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
    </script>
</head>
<body class="min-h-screen pb-16">

    <!-- Header Section -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg backdrop-blur-md bg-opacity-90">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-600 to-yellow-500 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-amber-500/30">
                    R
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-bold text-white leading-tight">Rooc Reward System</h1>
                    <p class="text-[11px] sm:text-xs text-slate-400">ระบบจัดการคิวและสถานะรับรางวัลแยกอิสระ</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- ปุ่มบันทึกประจำวัน (แสดงเฉพาะตอนเปิด Admin) -->
                <button id="global-save-btn" onclick="saveDailyData()" class="hidden px-3 py-1.5 sm:px-4 sm:py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs sm:text-sm font-bold transition items-center gap-1.5 shadow-md active:scale-95">
                    <span>💾</span> บันทึกข้อมูลประจำวัน
                </button>
                <button id="admin-toggle-btn" onclick="handleAdminToggle()" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 text-slate-200 shadow-md">
                    <span id="admin-icon">🔒</span> <span id="admin-text">โหมดผู้ดู (Read-only)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-3 sm:px-6 mt-4 space-y-4">

        <!-- Control Panel สำหรับปรับโควต้า -->
        <div id="admin-panel-container" class="hidden bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs sm:text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <span>⚙️</span> ตั้งค่าจำนวนโควต้าของรางวัล
                </h2>
                <span id="last-saved-time" class="text-[11px] text-slate-400">ยังไม่มีการบันทึกข้อมูลวันนี้</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1">
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <label class="block text-xs font-semibold text-slate-200 mb-1">🕊️ ขนขาว</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-white-max" value="50" onchange="updateConfigLocal()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center font-bold">
                        <span class="text-[10px] text-slate-400">หน้า</span>
                    </div>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-red-950/40">
                    <label class="block text-xs font-semibold text-red-400 mb-1">🪶 ขนแดง</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-red-max" value="80" onchange="updateConfigLocal()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-red-400 text-center font-bold">
                        <span class="text-[10px] text-slate-400">หน้า</span>
                    </div>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-blue-950/40">
                    <label class="block text-xs font-semibold text-blue-400 mb-1">📘 สมุดการ์ด</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-card-max" value="1" onchange="updateConfigLocal()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-blue-400 text-center font-bold">
                        <span class="text-[10px] text-slate-400">เล่ม</span>
                    </div>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-amber-950/40">
                    <label class="block text-xs font-semibold text-amber-400 mb-1">📦 เศษทอง</label>
                    <div class="flex items-center gap-1">
                        <input type="number" id="cfg-chest-max" value="1" onchange="updateConfigLocal()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-amber-400 text-center font-bold">
                        <span class="text-[10px] text-slate-400">ชิ้น</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 grid grid-cols-2 sm:grid-cols-4 gap-1.5 shadow-lg">
            <button onclick="switchTab('white')" id="tab-btn-white" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">🕊️ ขนขาว</button>
            <button onclick="switchTab('red')" id="tab-btn-red" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">🪶 ขนแดง</button>
            <button onclick="switchTab('card')" id="tab-btn-card" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">📘 สมุดการ์ด</button>
            <button onclick="switchTab('chest')" id="tab-btn-chest" class="px-2 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition">📦 เศษทอง</button>
        </div>

        <!-- Content Area -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 sm:p-5 shadow-xl min-h-[450px]">
            <div class="flex flex-wrap justify-between items-center pb-3 mb-3 border-b border-slate-800 gap-2">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2" id="current-tab-title">🕊️ คิวขนขาว</h2>
                    <p class="text-[11px] sm:text-xs text-slate-400" id="current-tab-sub">แสดงรายชื่อคิว Rooc Reward</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="admin-reset-tab-btn" onclick="openResetModal()" class="hidden bg-red-950 hover:bg-red-900 text-red-300 border border-red-800/60 text-xs font-semibold px-3 py-1.5 rounded-xl transition items-center gap-1 shadow">
                        <span>🔄</span> รีเซ็ตคิวหมวดนี้
                    </button>
                    <button onclick="copyCurrentQueueList()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl transition flex items-center gap-1.5 shadow-md active:scale-95">
                        <span>📋</span> คัดลอกรายชื่อทั้งหมด
                    </button>
                </div>
            </div>

            <!-- รายชื่อคิว -->
            <div id="active-queue-list" class="space-y-2.5">
                <div class="text-center text-slate-500 py-10">กำลังซิงค์รายชื่อจากระบบหลัก...</div>
            </div>
        </div>

    </main>

    <!-- Modal ใส่รหัส Admin -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto text-xl mb-2">🔐</div>
                <h3 class="font-bold text-slate-100 text-base">เข้าสู่โหมดแอดมิน (Admin)</h3>
            </div>
            <form onsubmit="verifyAdminPassword(event)" class="space-y-3">
                <input type="password" id="admin-pass-input" required placeholder="ใส่รหัสผ่านแอดมิน..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white text-center focus:outline-none focus:border-blue-500">
                <div id="admin-error-msg" class="text-xs text-red-4
